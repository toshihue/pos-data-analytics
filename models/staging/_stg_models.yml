version: 2

models:
  - name: stg_transactions
    description: "売上明細（クレンジング済み）"
    columns:
      - name: transaction_id
        description: "取引ID"
      - name: store_id
        description: "店舗ID"
      - name: product_id
        description: "商品ID"
      - name: quantity
        description: "数量"
      - name: unit_price
        description: "税抜単価"
      - name: total_amount
        description: "税込合計金額"
      - name: transaction_at
        description: "取引日時"
      - name: transaction_date
        description: "取引日"

  - name: stg_products
    description: "商品マスタ（クレンジング済み）"
    columns:
      - name: product_id
        description: "商品ID"
      - name: product_name
        description: "商品名"
      - name: category
        description: "商品カテゴリ"
      - name: unit_price
        description: "税抜単価"
      - name: tax_rate
        description: "消費税率"
      - name: is_active
        description: "販売中フラグ"

  - name: stg_stores
    description: "店舗マスタ（クレンジング済み）"
    columns:
      - name: store_id
        description: "店舗ID"
      - name: store_name
        description: "店舗名"
      - name: prefecture
        description: "都道府県"
      - name: opened_at
        description: "開店日"

unit_tests:
  - name: test_tax_calculation
    description: "商品ごとの tax_rate に従って stg_transactions.total_amount が正しく計算されることを検証する"
    model: stg_transactions
    given:
      - input: source('pos', 'raw_transactions')
        rows:
          - {transaction_id: TEST-001, store_id: S001, product_id: P001, quantity: 2, unit_price: 100, transaction_at: '2024-01-01 10:00:00'}
          - {transaction_id: TEST-002, store_id: S001, product_id: P002, quantity: 3, unit_price: 100, transaction_at: '2024-01-01 11:00:00'}
      - input: source('pos', 'raw_products')
        rows:
          - {product_id: P001, product_name: 緑茶, category: 飲料, unit_price: 100, tax_rate: 0.08, is_active: true}
          - {product_id: P002, product_name: 洗剤, category: 日用品, unit_price: 100, tax_rate: 0.10, is_active: true}
    expect:
      rows:
        - {transaction_id: TEST-001, total_amount: 216.00}
        - {transaction_id: TEST-002, total_amount: 330.00}

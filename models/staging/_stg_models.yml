version: 2

models:
  - name: stg_transactions
    description: "売上明細（クレンジング済み）"
    columns:
      - name: transaction_id
        description: "取引ID"
      - name: store_id
        description: "店舗ID"
      - name: product_id
        description: "商品ID"
      - name: quantity
        description: "数量"
      - name: unit_price
        description: "税抜単価"
      - name: total_amount
        description: "税込合計金額（下流互換のため保持）"
      - name: calculated_total_amount
        description: "税率込みで計算した税込合計金額"
      - name: transaction_at
        description: "取引日時"
      - name: transaction_date
        description: "取引日"

  - name: stg_products
    description: "商品マスタ（クレンジング済み）"
    columns:
      - name: product_id
        description: "商品ID"
      - name: product_name
        description: "商品名"
      - name: category
        description: "商品カテゴリ"
      - name: unit_price
        description: "税抜単価"
      - name: tax_rate
        description: "消費税率"
      - name: is_active
        description: "販売中フラグ"

  - name: stg_stores
    description: "店舗マスタ（クレンジング済み）"
    columns:
      - name: store_id
        description: "店舗ID"
      - name: store_name
        description: "店舗名"
      - name: prefecture
        description: "都道府県"
      - name: opened_at
        description: "開店日"

unit_tests:
  - name: test_tax_calculation
    description: "stg_transactions の税込金額 calculated_total_amount が税率込みで正しく計算されることを検証する"
    model: stg_transactions
    given:
      - input: source('pos', 'raw_transactions')
        rows:
          - {
              transaction_id: 'TEST-001',
              store_id: 1,
              product_id: 'P-DRINK',
              quantity: 2,
              unit_price: 150,
              transaction_at: '2024-01-01 10:00:00'
            }
          - {
              transaction_id: 'TEST-002',
              store_id: 1,
              product_id: 'P-DAILY',
              quantity: 3,
              unit_price: 200,
              transaction_at: '2024-01-01 11:00:00'
            }
      - input: source('pos', 'raw_products')
        rows:
          - {
              product_id: 'P-DRINK',
              category: '飲料',
              tax_rate: 0.08
            }
          - {
              product_id: 'P-DAILY',
              category: '日用品',
              tax_rate: 0.10
            }
    expect:
      rows:
        - {transaction_id: 'TEST-001', calculated_total_amount: 324.00}
        - {transaction_id: 'TEST-002', calculated_total_amount: 660.00}

version: 2

models:
  - name: fct_daily_store_sales
    description: "日別・店舗別売上集計"
    data_tests:
      - unique:
          arguments:
            column_name: "(store_id || '-' || cast(sales_date as varchar))"
    columns:
      - name: store_id
        description: "店舗ID"
      - name: store_name
        description: "店舗名"
      - name: prefecture
        description: "都道府県"
      - name: sales_date
        description: "売上日"
      - name: total_sales
        description: "売上合計（税込）"
      - name: total_quantity
        description: "販売数量合計"
      - name: transaction_count
        description: "取引件数"
      - name: average_basket_value
        description: "平均客単価（税込）"

  - name: fct_daily_category_sales
    description: "日別・カテゴリ別売上集計"
    data_tests:
      - unique:
          arguments:
            column_name: "(category || '-' || cast(sales_date as varchar))"
    columns:
      - name: category
        description: "商品カテゴリ"
      - name: sales_date
        description: "売上日"
      - name: total_sales
        description: "売上合計（税込）"
      - name: total_quantity
        description: "販売数量合計"
      - name: transaction_count
        description: "取引件数"
      - name: average_basket_value
        description: "平均客単価（税込）"
